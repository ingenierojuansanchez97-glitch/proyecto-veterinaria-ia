<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title or "App" }}</title>
      <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/logo.png" />
    <style>
        body {
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        header {
            background: #1976D2;
            color: #fff;
            padding: 12px 16px;
        }

        main {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn {
            background: #1976D2;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer
        }

            .btn.secondary {
                background: #455A64
            }

            .btn.warn {
                background: #FB8C00
            }

            .btn.danger {
                background: #E53935
            }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .col {
            flex: 1 1 240px
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d6d9e0;
            border-radius: 10px;
            background: #fff
        }

        label {
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
            display: block
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            text-align: left
        }

        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px
        }

            .alert.error {
                background: #ffebee;
                color: #b71c1c
            }

            .alert.success {
                background: #e8f5e9;
                color: #1b5e20
            }

            .alert.info {
                background: #e3f2fd;
                color: #0d47a1
            }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            color: #fff;
            display: inline-block
        }

            .badge.green {
                background: #43A047
            }

            .badge.orange {
                background: #FB8C00
            }

            .badge.red {
                background: #E53935
            }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .center {
            text-align: center
        }
    </style>
</head>
<body>
    <header>
        <div style="display:flex;align-items:center;gap:10px;">
            <img src="/static/logo.png" alt="logo" width="28" height="28" onerror="this.style.display='none'">
            <div style="font-weight:700">{{ title }}</div>
            <div style="margin-left:auto">
                {% if user %}
                <span>{{ user.name }} — {{ user.clinic or "(sin clínica)" }}</span>
                <a class="btn secondary" href="/logout" style="margin-left:10px;text-decoration:none;">Salir</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
